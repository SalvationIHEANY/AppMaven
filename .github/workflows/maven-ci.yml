name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Paso 1: Descargar tu código
    - uses: actions/checkout@v4
    # Paso 2: Instalar Java en el servidor
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Esto hace que las descargas sean más rápidas
      # Paso 3: Ejecutar Maven (Compilar y Testear)
    - name: Build with Maven
      run: mvn -B package --file pom.xml
